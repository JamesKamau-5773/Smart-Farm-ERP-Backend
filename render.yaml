services:
  - type: web
    name: smart-farm-erp-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/start_web.sh
    healthCheckPath: /health
    # Same site as the frontend (www.maziwasmart.co.ke), so session and CSRF cookies work.
    domains:
      - api.maziwasmart.co.ke
    envVars:
      - key: FRONTEND_BASE_URL
        value: https://www.maziwasmart.co.ke
      - key: GOOGLE_REDIRECT_URI
        value: https://api.maziwasmart.co.ke/api/auth/google/callback
      # Public read-only demo farm ("Silato Farm"). scripts/start_web.sh seeds it on the
      # first deploy with this set; visitors then refresh its dates once a day.
      - key: DEMO_ENABLED
        value: "True"
      - key: DEMO_SESSION_MINUTES
        value: "45"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Uploaded images and receipt photos (app/services/media_storage.py). Render's own disk is
      # wiped on every deploy, so files must live elsewhere. cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_URL
        sync: false
